<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마롱컴퍼니 | 조형물 · 건축미술 제작</title>
<meta name="description" content="마롱컴퍼니의 작품, 소재, 회사 소개.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500..800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root {
  --ink: #111111; --paper: #FFFFFF; --hair: #D9D6DF; --sub: #5E5A6E; --muted: #9A97A8;
  --deep: #5443A3; --soft: #AB94D1; --lime: #A1D239; --tint: #F3F1F6;
  --font: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --en: 'Archivo', 'Pretendard Variable', 'Pretendard', sans-serif;
  --gutter: 20px; --side: 252px; --strip: 0px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: auto; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.65; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; background: none; border: 0; padding: 0; text-align: left; }
a { color: inherit; }
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 3px; }
.cap { font-family: var(--en); font-stretch: 125%; font-weight: 600; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; }
.in { max-width: 1240px; margin-inline: auto; padding-inline: var(--gutter); }

/* strata (sections) */
.sec { scroll-margin-top: var(--strip); }
.band { background: var(--c); color: var(--t); }
.band .in { display: grid; gap: 22px; padding-block: 34px 30px; }
@media (min-width: 900px) { .band .in { grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) minmax(0, 3fr); gap: 44px; align-items: end; padding-block: 46px 40px; } }
.b-id { display: grid; gap: 10px; }
.b-num { font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: clamp(64px, 17vw, 150px); line-height: .8; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 1.5px var(--t); font-variant-numeric: tabular-nums; margin-left: -3px; }
.b-name { display: grid; gap: 2px; margin-top: 8px; }
.b-name h2 { font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: clamp(22px, 3.6vw, 38px); line-height: 1.05; letter-spacing: -0.03em; text-transform: uppercase; }
.b-name p { font-size: 13px; opacity: .8; }
.b-tx { display: grid; gap: 16px; align-content: end; }
.b-tx .tg { font-size: clamp(15px, 2vw, 17px); font-weight: 700; line-height: 1.5; letter-spacing: -0.025em; text-wrap: balance; }
.b-sp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid currentColor; }
.b-sp div { padding: 8px 10px 0 0; display: grid; gap: 1px; }
.b-sp div + div { padding-left: 10px; border-left: 1px solid color-mix(in srgb, currentColor 35%, transparent); }
.b-sp dt { font-family: var(--en); font-stretch: 125%; font-size: 9px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.b-sp dd { margin: 0; font-size: 12.5px; font-weight: 700; line-height: 1.4; }
.b-act { display: flex; flex-wrap: wrap; gap: 10px 24px; align-content: end; }
@media (min-width: 900px) { .b-act { flex-direction: column; align-items: flex-start; gap: 12px; } }
.b-act button, .b-act a { font-weight: 800; font-size: 13.5px; text-decoration: none; border-bottom: 2px solid currentColor; padding-bottom: 1px; color: inherit; }
.b-act button::after { content: ' ▾'; font-size: 10px; }
.b-act button[aria-expanded="true"]::after { content: ' ▴'; }
.b-act button:hover, .b-act a:hover { opacity: .7; }

.det { background: var(--tint); border-bottom: 1px solid var(--ink); }
.det[hidden] { display: none; }
.det .in { display: grid; gap: 28px; padding-block: 28px 34px; animation: pin .45s cubic-bezier(.2,.7,.2,1); }
@keyframes pin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@media (min-width: 900px) { .det .in { grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 56px; align-items: start; } }
.fig svg { display: block; width: 100%; max-width: 520px; height: auto; margin-inline: auto; overflow: visible; }
.figcap { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); margin-top: 6px; }
.legend { list-style: none; border-top: 1px solid var(--ink); margin-top: 14px; }
.legend li { display: grid; grid-template-columns: 38px minmax(0, 10em) minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 13px; line-height: 1.5; }
.legend em { font-style: normal; font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: 12px; color: var(--deep); }
.legend span { color: var(--sub); }
@media (max-width: 560px) { .legend li { grid-template-columns: 34px minmax(0, 1fr); } .legend span { grid-column: 2; } }
.det h3 { font-family: var(--en); font-stretch: 125%; font-weight: 700; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
.det .col { display: grid; gap: 26px; align-content: start; }
.pts { list-style: none; display: grid; gap: 10px; }
.pts li { display: grid; grid-template-columns: 22px minmax(0, 1fr); font-size: 13.5px; color: #34313f; line-height: 1.6; }
.pts li::before { content: '—'; color: var(--deep); font-weight: 700; }
.steps { list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--hair); font-weight: 700; font-size: 14.5px; letter-spacing: -0.02em; }
.steps li::before { content: '0' counter(s); font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: 12px; color: var(--deep); letter-spacing: 0; }
.det .blk { display: grid; gap: 10px; }

.wk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; }
.wk-head .cap { color: var(--ink); } .wk-head .n { color: var(--muted); }
.works { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }
@media (min-width: 640px) { .works { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 18px; } }
@media (min-width: 1000px) { .works { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px 22px; } }
.wk { display: grid; grid-template-rows: 1fr auto; gap: 8px; min-width: 0; text-decoration: none; }
.wk .im { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--tint); display: block; }
.wk .im svg, .wk .im img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
@media (hover: hover) { .wk:hover .im svg, .wk:hover .im img { transform: scale(1.05); } }
.wk figcaption, .wk .fc { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--ink); padding-top: 6px; }
.wk .nm { font-size: 12.5px; font-weight: 700; line-height: 1.4; }
.wk .pid { font-family: var(--en); font-stretch: 125%; font-weight: 600; font-size: 9.5px; letter-spacing: .12em; color: var(--muted); white-space: nowrap; text-transform: uppercase; }
.wk.big { grid-column: span 2; }
.wk.big .im { aspect-ratio: 4 / 3; }
@media (min-width: 640px) { .wk.big { grid-row: span 2; } .works:has(.wk:nth-child(3)) .wk.big .im { aspect-ratio: auto; min-height: 0; } }
.wk.cta { grid-template-rows: 1fr; border-top: 1px solid var(--ink); }
.wk.cta a { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 120px; height: 100%; padding: 14px 16px 16px; background: var(--c); color: var(--t); text-decoration: none; font-weight: 800; font-size: clamp(15px, 2vw, 18px); line-height: 1.3; letter-spacing: -0.03em; transition: filter .25s; }
.wk.cta a:hover { filter: brightness(.94); }
.wk.cta a span { font-family: var(--en); font-size: 22px; }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 24px 0; }

/* overlay */
.ovl { position: fixed; inset: 0; z-index: 100; background: var(--paper); overflow-y: auto; overscroll-behavior: contain; animation: oin .35s cubic-bezier(.2,.7,.2,1); }
@keyframes oin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.ovl-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px var(--gutter); background: rgba(255,255,255,.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--ink); }
.ovl-bar .cap { color: var(--muted); }
.ovl-bar .acts { display: flex; align-items: center; gap: 4px; }
.ovl-bar button { font-family: var(--en); font-stretch: 125%; font-weight: 700; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; padding: 8px 10px; }
.ovl-bar button:hover { color: var(--deep); }
.ovl-bar .x { border-bottom: 1.5px solid var(--ink); padding: 8px 2px 2px; margin-left: 10px; }
.wv { max-width: 1160px; margin-inline: auto; padding: 22px var(--gutter) 70px; display: grid; gap: 22px; }
@media (min-width: 900px) { .wv { grid-template-columns: minmax(0, 6fr) minmax(0, 4fr); gap: 44px; align-items: start; padding-top: 34px; } }
.wv .pic { position: relative; aspect-ratio: 4 / 5; background: var(--tint); overflow: hidden; max-height: 78vh; width: 100%; }
.wv .pic svg, .wv .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.wv .info { display: grid; gap: 16px; align-content: start; }
.wv h2 { font-size: clamp(22px, 3vw, 30px); line-height: 1.25; font-weight: 800; letter-spacing: -0.03em; }
.wv .pidl { color: var(--muted); }
.wv dl { border-top: 1px solid var(--ink); }
.wv dl div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 13px; }
.wv dt { font-family: var(--en); font-stretch: 125%; font-weight: 600; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.wv dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.wv dd a { font-weight: 700; text-decoration: none; border-bottom: 1.5px solid var(--deep); color: var(--deep); }
.wv .ds { color: var(--sub); font-size: 13.5px; line-height: 1.7; }
.go { border-top: 1px solid var(--ink); }
.go a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--hair); text-decoration: none; font-weight: 800; font-size: clamp(15px, 2.4vw, 18px); letter-spacing: -0.03em; transition: padding .3s, color .3s; }
.go a span { font-family: var(--en); font-size: 18px; }
.go a:hover { color: var(--deep); padding-left: 6px; }

/* ---------- layout: side (desktop) / top (mobile) ---------- */
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo svg { width: 32px; height: auto; fill: var(--ink); display: block; flex: none; }
.logo b { font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: 13px; line-height: 1.05; letter-spacing: -0.01em; text-transform: uppercase; }
.side { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: var(--side); padding: 26px 26px 20px; background: var(--paper); display: none; flex-direction: column; gap: 22px; overflow-y: auto; border-right: 1px solid var(--ink); }
.nav { display: grid; gap: 4px; font-size: 13px; }
.nav a { text-decoration: none; padding: 1px 0; width: fit-content; }
.nav a[aria-current] { border-bottom: 1.5px solid var(--ink); }
.nav a:hover { color: var(--deep); }
.lh { display: flex; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--ink); padding-top: 10px; }
.lh .cap { color: var(--ink); } .lh .n { color: var(--muted); }
.stk svg { display: block; width: 100%; height: auto; overflow: visible; }
.stk .slab { cursor: pointer; transition: transform .35s cubic-bezier(.2,.7,.2,1), opacity .3s; }
.stk.has-f .slab { filter: grayscale(1) brightness(1.18) contrast(.8); }
.stk.has-f .slab.on { filter: none; transform: translateY(-9px); }
@media (hover: hover) { .stk .slab:hover { filter: none; } }
.stk .slab:focus-visible { outline: none; }
.stk .slab:focus-visible path:first-child { stroke: var(--deep); stroke-width: 2; }
.flt { display: grid; gap: 1px; font-size: 13px; }
.flt button { display: grid; grid-template-columns: 12px 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; color: var(--sub); }
.flt button:hover { color: var(--ink); }
.flt button[aria-pressed="true"] { color: var(--ink); font-weight: 800; }
.flt i { width: 10px; height: 10px; display: block; }
.flt em { font-style: normal; font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: 11px; color: var(--deep); }
.flt .n { font-family: var(--en); font-size: 10px; color: var(--muted); font-weight: 600; }
.side-foot { margin-top: auto; font-size: 11px; line-height: 1.6; color: var(--muted); }
main { min-width: 0; }
@media (min-width: 900px) { .side { display: flex; } .top { display: none; } main { margin-left: var(--side); } }

.top { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.97); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--ink); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px var(--gutter) 4px; }
.top-in .logo svg { width: 28px; }
.top-in a.g { font-size: 12.5px; font-weight: 700; text-decoration: none; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.mchips { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 0 calc(var(--gutter) - 8px); scroll-padding-inline: 20px; }
.mchips::-webkit-scrollbar { display: none; }
.mchips button { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 8px 7px; border-bottom: 3px solid transparent; font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: 12px; color: var(--muted); }
.mchips button svg { width: 22px; height: 14px; display: block; }
.mchips button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.mchips .n { font-weight: 600; font-size: 9.5px; margin-left: 2px; }

/* ---------- page ---------- */
.page-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 24px var(--gutter) 12px; }
.page-h h1 { font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: clamp(22px, 3.4vw, 34px); letter-spacing: -0.03em; text-transform: uppercase; line-height: 1; }
.page-h .cap { color: var(--muted); }
.band[hidden] { display: none; }
.band .in { max-width: none; }
.listwrap { padding: 8px var(--gutter) 56px; }
@media (min-width: 900px) { .page-h, .listwrap { padding-inline: 32px; } .band .in { padding-inline: 32px; } .det .in { padding-inline: 32px; max-width: none; } }
.works { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; }
@media (min-width: 640px) { .works { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 18px; } }
@media (min-width: 900px) { .works { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 22px; } }
@media (min-width: 900px) { .works { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 18px; } }
@media (min-width: 1500px) { .works { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.works { row-gap: 22px; }
.wk .im { aspect-ratio: 1 / 1; }
.wk.big .im { aspect-ratio: 4 / 3; }
.wv .pic { aspect-ratio: 1 / 1; }
.wk { animation: cin .45s ease both; }
@keyframes cin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.wk .fc { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 10px; }
.wk .mt { grid-column: 1 / -1; font-family: var(--en); font-stretch: 125%; font-weight: 600; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.wk .lay { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column-reverse; }
.wk .lay i { display: block; height: 7px; box-shadow: inset 0 1px 0 rgba(255,255,255,.55); }
.more { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; margin-top: 40px; padding: 18px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--hair); font-weight: 800; font-size: clamp(15px, 2.4vw, 18px); letter-spacing: -0.03em; transition: padding .3s, color .3s; }
.more span { font-family: var(--en); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .1em; }
.more:hover { color: var(--deep); padding-left: 6px; }
.foot { border-top: 1px solid var(--ink); }
.foot .in { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-block: 18px 44px; color: var(--muted); font-size: 11.5px; max-width: none; }
@media (min-width: 900px) { .foot .in { padding-inline: 32px; } }
.band { scroll-margin-top: 0; }

/* ---------- sections ---------- */
#v-about section { scroll-margin-top: 0; }
@media (max-width: 899px) { #v-about section { scroll-margin-top: 82px; } }
.abnd { background: var(--c); color: var(--t); }
.abnd .abi { display: grid; gap: 14px; padding: 30px 20px 26px; }
@media (min-width: 900px) { .abnd .abi { grid-template-columns: auto minmax(0, 1fr); align-items: end; gap: 36px; padding: 40px 36px 34px; } }
.abn { font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: clamp(64px, 15vw, 130px); line-height: .8; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 1.5px var(--t); font-variant-numeric: tabular-nums; margin-left: -3px; }
.abq { display: grid; gap: 4px; }
.abq h2 { font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: clamp(22px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.03em; text-transform: uppercase; }
.abq p { font-size: 14px; font-weight: 700; opacity: .85; }
.abbody { padding: 34px 20px 56px; }
@media (min-width: 900px) { .abbody { padding: 44px 36px 72px; } }
.ph { position: relative; overflow: hidden; background: var(--tint); display: block; }
.ph svg, .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .tg { position: absolute; left: 10px; top: 10px; z-index: 1; font-family: var(--en); font-stretch: 125%; font-weight: 700; font-size: 8.5px; letter-spacing: .14em; color: var(--muted); background: var(--paper); padding: 2px 6px; border: 1px solid var(--hair); }
.two > div > .ph { aspect-ratio: 4 / 3; }
@media (min-width: 900px) { .two > div > .ph { aspect-ratio: 4 / 5; } }
.lead { font-size: clamp(22px, 3.4vw, 38px); line-height: 1.32; font-weight: 800; letter-spacing: -0.04em; text-wrap: balance; }
.txt { color: var(--sub); font-size: 14.5px; line-height: 1.8; max-width: 52ch; }
.two { display: grid; gap: 28px; }
@media (min-width: 900px) { .two { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 56px; align-items: start; } }
.stack { display: grid; gap: 20px; align-content: start; }
/* what */
.svc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; border-top: 1px solid var(--ink); }
@media (min-width: 900px) { .svc { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 28px; } }
.svc li { list-style: none; padding: 14px 0 22px; border-bottom: 1px solid var(--hair); display: grid; gap: 6px; align-content: start; }
.svc em { font-style: normal; font-family: var(--en); font-stretch: 125%; font-weight: 800; font-size: 12px; color: var(--deep); }
.svc b { font-size: 16px; font-weight: 800; letter-spacing: -0.03em; }
.svc span { font-size: 13px; color: var(--sub); }
/* how */
.abst { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; }
@media (min-width: 900px) { .abst { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 22px; } }
.stp { display: grid; gap: 8px; align-content: start; }
.stp .ph { aspect-ratio: 4 / 3; }
.stp .h { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: baseline; border-top: 1px solid var(--ink); padding-top: 7px; }
