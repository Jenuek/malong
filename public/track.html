<html lang="ko">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --ink: #111111; --sub: #5E5A6E; --muted: #9A97A8; --line: #D9D6DF; --surface: #F3F1F6;
  --violet: #6458B1; --deep: #5443A3; --soft: #AB94D1; --bg: #FFFFFF; --lime: #A1D239;
  --font: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --en: 'Archivo', 'Pretendard Variable', 'Pretendard', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; letter-spacing: -0.012em; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 3px; }
[hidden] { display: none !important; }
.cap { font-family: var(--en); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--ink); }
.top-in { max-width: 960px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; font-family: var(--en); font-weight: 800; font-size: 12px; letter-spacing: .06em; line-height: 1.1; }
.brand svg { width: 28px; height: 22px; fill: var(--ink); }
.gnav { display: flex; gap: 18px; margin-left: auto; font-size: 13px; }
.gnav a { text-decoration: none; white-space: nowrap; }
.gnav a:hover { color: var(--deep); }
.gnav [aria-current] { border-bottom: 1.5px solid var(--ink); font-weight: 700; }
@media (max-width: 559px) { .gnav { gap: 12px; font-size: 12.5px; } .brand span { display: none; } .lg { display: none; } }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

/* 코드 입력 */
.find { max-width: 520px; margin: 0 auto; padding: 72px 20px 96px; }
.find h1 { font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.25; margin: 10px 0 14px; }
.find p { color: var(--sub); }
.find form { display: flex; gap: 8px; margin-top: 28px; }
.find input { flex: 1; min-width: 0; height: 52px; padding: 0 16px; border: 1px solid var(--ink); border-radius: 12px; background: #fff; font-family: var(--en); font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.find input::placeholder { color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 52px; padding: 0 22px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14.5px; text-decoration: none; }
.btn:hover { background: var(--deep); border-color: var(--deep); }
.btn.ln { background: #fff; color: var(--ink); }
.btn.ln:hover { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.btn.sm { height: 42px; padding: 0 18px; font-size: 13.5px; }
.err { margin-top: 16px; padding: 12px 14px; border: 1px solid #C8323C; border-radius: 12px; color: #9C2430; background: #FDF3F4; font-size: 14px; }
.find .help { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--sub); }
.load { padding: 120px 20px; text-align: center; color: var(--muted); }

/* 프로젝트 머리 */
.head { padding: 44px 0 26px; display: grid; gap: 22px; }
.head h1 { font-size: clamp(28px, 5.4vw, 44px); font-weight: 800; letter-spacing: -0.045em; line-height: 1.2; margin-top: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 28px; margin-top: 14px; color: var(--sub); font-size: 14px; }
.meta b { color: var(--ink); font-weight: 700; margin-left: 6px; }
.now { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; background: var(--deep); color: #fff; font-weight: 700; font-size: 14px; width: fit-content; }
.now i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(161,210,57,.7); animation: pulse 1.8s infinite; }
.now.done { background: var(--ink); } .now.done i { animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(161,210,57,0); } 100% { box-shadow: 0 0 0 0 rgba(161,210,57,0); } }

/* 단계 */
.steps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 0; }
.steps li { display: grid; gap: 10px; }
.steps li::before { content: ''; height: 4px; background: var(--line); }
.steps li.done::before { background: var(--ink); }
.steps li.cur::before { background: var(--violet); height: 6px; margin-top: -1px; }
.steps span { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.steps em { font-style: normal; font-family: var(--en); font-weight: 800; font-size: 11px; display: block; letter-spacing: .08em; margin-bottom: 2px; }
.steps li.done span { color: var(--sub); }
.steps li.cur span { color: var(--ink); font-weight: 700; }
.steps-m { display: none; margin-top: 12px; font-size: 13.5px; color: var(--sub); }
@media (max-width: 679px) { .steps span { display: none; } .steps-m { display: block; } }
.stepdesc { margin-top: 14px; padding: 14px 16px; background: var(--surface); border-radius: 12px; color: var(--sub); font-size: 14px; }
.stepdesc b { color: var(--ink); }

/* 섹션 */
.sec { padding: 38px 0 6px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin-bottom: 18px; }
.sec-h h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }

/* 3D */
.v3d { position: relative; background: var(--surface); border-radius: 16px; overflow: hidden; }
/* 스케치팹 */
.v3d iframe { display: block; width: 100%; height: min(62vh, 540px); border: 0; }
.sfc { margin: 0; padding: 8px 14px; font-size: 11.5px; color: var(--muted); text-align: right; background: var(--surface); }
.sfc a { text-decoration: none; }
model-viewer { display: block; width: 100%; height: min(62vh, 540px); --poster-color: transparent; }
.v3d .tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 2; }
.v3d .tools button { height: 36px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 999px; background: #fff; font-size: 12.5px; font-weight: 700; }
.v3d .tools button:hover { background: var(--ink); color: #fff; }
.v3d .hint { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--sub); pointer-events: none; }
.v3d.empty { display: grid; place-items: center; min-height: 220px; padding: 28px; text-align: center; color: var(--muted); }
.v3d.full { position: fixed; inset: 0; z-index: 50; border-radius: 0; }
.v3d.full model-viewer { height: 100%; }
.dlnote { margin-top: 10px; font-size: 12.5px; color: var(--muted); }

/* 승인 */
.ask { margin-top: 18px; padding: 20px; border: 1.5px solid var(--deep); border-radius: 16px; display: grid; gap: 14px; }
.ask h3 { font-size: 16.5px; font-weight: 800; letter-spacing: -0.03em; }
.ask p { color: var(--sub); font-size: 14px; }
.ask .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* 기록 */
.tl > li { display: grid; grid-template-columns: 112px 1fr; gap: 6px 22px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.tl .d { font-family: var(--en); font-weight: 700; font-size: 13px; color: var(--sub); }
.tl .d small { display: block; margin-top: 6px; font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--deep); letter-spacing: -0.01em; }
.tl h3 { font-size: 16.5px; font-weight: 800; letter-spacing: -0.03em; }
.tl p { margin-top: 6px; color: var(--sub); font-size: 14.5px; white-space: pre-line; }
.ph { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
.ph button { padding: 0; border: 0; background: var(--surface); border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
@media (hover: hover) { .ph button:hover img { transform: scale(1.04); } }
.empty-tl { padding: 28px 0; color: var(--muted); }
@media (max-width: 559px) { .tl > li { grid-template-columns: 1fr; } .tl .d small { display: inline; margin: 0 0 0 8px; } }
.tl > li:first-child .d small::after { content: ' · 최신'; color: var(--muted); font-weight: 500; }


/* 단계별 안내 */
.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.ic { padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 8px; align-content: start; }
.ic b { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; }
.ic b.nx { font-size: 15px; line-height: 1.45; }
.bar { height: 8px; background: var(--line); border-radius: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--violet); border-radius: 8px; }
.latest { display: block; position: relative; width: 100%; padding: 0; border: 0; background: var(--surface); border-radius: 16px; overflow: hidden; text-align: left; aspect-ratio: 16 / 9; max-height: 520px; }
.latest img { width: 100%; height: 100%; object-fit: cover; display: block; }
.latest span { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 20px 16px; color: #fff; font-size: 13.5px; line-height: 1.5; background: linear-gradient(transparent, rgba(17,17,17,.72)); }
.latest span b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 2px; }
.fin { padding: 28px 24px; border: 1.5px solid var(--ink); border-radius: 16px; background: linear-gradient(135deg, #F3F1F6, #fff); display: grid; gap: 10px; }
.fin h2 { font-size: clamp(22px, 4vw, 28px); font-weight: 800; letter-spacing: -0.04em; }
.fin p { color: var(--sub); max-width: 62ch; }
.fin .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; }
.tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
.demo { position: sticky; top: 49px; z-index: 15; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 10px 20px; background: #FFF9D6; border-bottom: 1px solid #E8D98A; font-size: 12.5px; }
.demo .cap { color: var(--ink); }
.demo > span:nth-child(2) { margin-right: 4px; color: var(--sub); }
.demo button { height: 30px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 999px; background: #fff; font-size: 12.5px; font-weight: 700; }
.demo button[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* 하단 */
.foot { margin-top: 56px; border-top: 1px solid var(--ink); padding: 26px 0 60px; display: flex; flex-wrap: wrap; gap: 18px 40px; justify-content: space-between; font-size: 13px; color: var(--sub); }
.foot b { color: var(--ink); }
.lb { position: fixed; inset: 0; z-index: 60; background: rgba(17,17,17,.92); display: grid; place-items: center; padding: 20px; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.lb button { position: absolute; top: 14px; right: 14px; height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #fff; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; z-index: 70; pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .now i { animation: none; } html { scroll-behavior: auto; } .ph img { transition: none; } }
</style>

    var head = '[' + (p.name || '프로젝트') + ' · ' + p.code + '] ';
    var text = kind === 'ok' ? head + '3D 시안을 확인했고, 이대로 진행해 주세요.' : head + '3D 시안 수정을 요청드립니다.\n수정하고 싶은 부분: ';
    function after() { toast((TRACK.KAKAO ? '내용을 복사했어요. 열린 채팅창에 붙여 넣어 주세요.' : '내용을 복사했어요. 담당자에게 전달해 주세요.')); if (TRACK.KAKAO) window.open(TRACK.KAKAO, '_blank', 'noopener'); }
    try { navigator.clipboard.writeText(text).then(after, function () { toast('자동 복사가 안 됐어요. 담당자에게 직접 알려 주세요.'); }); } catch (e) { toast('자동 복사가 안 됐어요. 담당자에게 직접 알려 주세요.'); }
  }
  function lightbox(u) {
    var d = document.createElement('div'); d.className = 'lb'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = '<img src="' + esc(u) + '" alt="" referrerpolicy="no-referrer"><button type="button">닫기</button>';
    function close() { d.remove(); document.removeEventListener('keydown', key); }
    function key(e) { if (e.key === 'Escape') close(); }
    d.addEventListener('click', close); document.addEventListener('keydown', key); document.body.appendChild(d);
  }

  /* ---------- 가져오기 ---------- */
  function fetchJSON(url) {
    return new Promise(function (ok, no) {
      var ac = window.AbortController ? new AbortController() : null, to = setTimeout(function () { if (ac) ac.abort(); no(new Error('timeout')); }, 15000);
      fetch(url, ac ? { signal: ac.signal } : {}).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) { clearTimeout(to); ok(j); }, function (e) { clearTimeout(to); no(e); });
    });
  }
  var token = 0;
  function route() {
    var code = getCode(), my = ++token;
    if (!code) { showFind(); return; }
    showLoad();
    var job;
    var dk = DEMO_KEYS.filter(function (k) { return k[0] === normCode(code); })[0];
    if (dk && (!TRACK.API || /^DEMO/.test(normCode(code)))) job = Promise.resolve(demoData(dk[0]));
    else if (!TRACK.API) job = Promise.resolve({ ok: false, error: 'notfound' });
    else job = fetchJSON(TRACK.API + (TRACK.API.indexOf('?') > -1 ? '&' : '?') + 'code=' + encodeURIComponent(code));
    job.then(function (d) {
      if (my !== token) return;
      if (d && d.ok && d.project) show(d);
      else if (d && d.error === 'busy') showFind('지금 접속이 많아요. 잠시 후 다시 시도해 주세요.');
      else showFind('접수코드를 찾을 수 없어요. 코드를 다시 확인해 주세요.');
    }, function () {
      if (my !== token) return;
      $('#app').innerHTML = '<section class="find"><p class="cap">Project Tracking</p><h1>연결이 원활하지 않아요</h1><p>잠시 후 다시 시도해 주세요. 계속 안 되면 담당자에게 알려 주세요.</p><form id="rt"><button class="btn" type="submit">다시 시도</button></form></section>';
      $('#rt').addEventListener('submit', function (e) { e.preventDefault(); route(); });
    });
  }
  window.addEventListener('hashchange', route);

  /* 사이트 메뉴 */
  $('#brand').setAttribute('href', TRACK.SITE); $('#nHome').setAttribute('href', TRACK.SITE); $('#nWork').setAttribute('href', 'work/'); $('#nAbout').setAttribute('href', 'about/'); $('#nGuide').setAttribute('href', TRACK.GUIDE);
  route();
})();
</script>
</body>
</html>
